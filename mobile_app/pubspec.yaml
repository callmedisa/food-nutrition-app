name: food_nutrition_app
description: NutriScan — система классификации изображений продуктов питания с применением методов машинного зрения

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  http: ^1.2.0

  # SQLite (заменяет shared_preferences — Clean Architecture: Data Layer)
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.5+1
  path: ^1.9.0

  # State management — Riverpod (Clean Architecture: Presentation Layer)
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/